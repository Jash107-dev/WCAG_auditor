<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy — WCAG Auditor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:#13172b;color:#f1f5f9;}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:40px 16px;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px;}
.brand-icon{width:40px;height:40px;background:linear-gradient(135deg,#6c63ff,#a78bfa);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 4px 16px rgba(108,99,255,0.45);}
.brand-name{color:#fff;font-size:15px;font-weight:700;}
.brand-sub{color:#475569;font-size:11px;margin-top:1px;}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:36px 40px;max-width:720px;width:100%;}
h1{font-size:26px;font-weight:800;color:#f1f5f9;margin-bottom:16px;}
p{color:#8892b0;font-size:14px;line-height:1.7;margin-bottom:12px;}
a.back{color:#a78bfa;text-decoration:none;font-size:13px;font-weight:600;display:inline-block;margin-top:20px;}
a.back:hover{color:#c4b5fd;}
</style>
</head>
<body>
<div class="brand">
    <div class="brand-icon">✓</div>
    <div>
        <div class="brand-name">WCAG Auditor</div>
        <div class="brand-sub">Accessibility Intelligence</div>
    </div>
</div>
<div class="card">
    <h1>Privacy Policy</h1>
    <p>Privacy Policy content coming soon.</p>
    <a href="{% url 'register' %}" class="back">← Back to Register</a>
</div>
</body>
</html>
