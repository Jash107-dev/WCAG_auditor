<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — WCAG Auditor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100%;
  font-family:'Inter',sans-serif;
  background:#13172b;
  color:#f1f5f9;
}
.page{
  display:flex;
  min-height:100vh;
  background:linear-gradient(135deg,#13172b 0%,#1a1f36 60%,#13172b 100%);
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}
.card{
  background:#1a1f36;
  border:1px solid rgba(255,255,255,0.07);
  border-radius:20px;
  padding:40px;
  width:100%;
  max-width:440px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
.brand-icon{
  width:36px;height:36px;background:#6c63ff;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;box-shadow:0 4px 12px rgba(108,99,255,0.4);flex-shrink:0;
}
.brand-icon svg{width:17px;height:17px}
.brand-name{color:#fff;font-size:14px;font-weight:700;}
.brand-sub{color:#6b7a99;font-size:11px;}
.card-title{color:#fff;font-size:26px;font-weight:800;margin-bottom:6px;letter-spacing:-0.02em;}
.card-sub{color:#8892b0;font-size:13.5px;margin-bottom:24px;}
.msgs{margin-bottom:14px}
.msg-error{background:rgba(239,68,68,0.12);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:6px}
.msg-success{background:rgba(16,185,129,0.12);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3);border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:6px}
.field{margin-bottom:16px}
.field label{display:block;color:#e2e8f0;font-size:13px;font-weight:600;margin-bottom:7px}
.fw{position:relative}
.fw input{
  width:100%;height:46px;background:#0f172a;border:1.5px solid #1e293b;
  border-radius:10px;padding:0 44px 0 15px;font-size:14px;
  font-family:'Inter',sans-serif;color:#f1f5f9;outline:none;
  transition:border-color .2s,box-shadow .2s;
  /* Prevent iOS zoom on focus */
  font-size:16px;
}
.fw input:focus{border-color:#6c63ff;box-shadow:0 0 0 3px rgba(108,99,255,0.15)}
.fw input::placeholder{color:#334155}
.tb{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:#334155;
  display:flex;padding:4px;transition:color .2s;
  /* Larger tap target on mobile */
  min-width:44px;min-height:44px;align-items:center;justify-content:flex-end;
}
.tb:hover{color:#6c63ff}
.tb svg{width:17px;height:17px}
.hint{color:#6b7a99;font-size:11.5px;margin-top:5px;display:flex;align-items:center;gap:5px}
.hint svg{width:11px;height:11px;flex-shrink:0}
.strength-wrap{margin-top:6px}
.strength-bars{display:flex;gap:4px;margin-bottom:4px}
.s-bar{flex:1;height:3px;border-radius:2px;background:#1e293b;transition:background .3s}
.s-bar.weak{background:#EF4444}.s-bar.fair{background:#F59E0B}.s-bar.good{background:#6c63ff}.s-bar.strong{background:#10B981}
.strength-label{font-size:11px;color:#6b7a99}
.btn-p{
  width:100%;background:linear-gradient(135deg,#6c63ff,#7c73ff);
  color:#fff;border:none;border-radius:10px;padding:14px;
  font-size:15px;font-weight:700;font-family:'Inter',sans-serif;
  cursor:pointer;transition:background .2s,transform .1s;
  margin-bottom:18px;box-shadow:0 4px 20px rgba(108,99,255,0.4);
  /* Minimum tap target */
  min-height:48px;
}
.btn-p:hover{background:linear-gradient(135deg,#5a52d5,#6c63ff)}
.btn-p:active{transform:scale(0.98)}
.btm{text-align:center;color:#6b7a99;font-size:13px}
.btm a{color:#6c63ff;text-decoration:none;font-weight:600}
.btm a:hover{text-decoration:underline}

/* Mobile */
@media(max-width:480px){
  .card{padding:28px 20px;border-radius:16px;}
  .card-title{font-size:22px;}
}
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">WCAG Auditor</div>
        <div class="brand-sub">Accessibility Intelligence</div>
      </div>
    </div>

    <div class="card-title">Set new password</div>
    <div class="card-sub">Choose a strong password for your account</div>

    {% if messages %}
    <div class="msgs">
      {% for message in messages %}
        <div class="msg-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'reset_password' token %}">
      {% csrf_token %}

      <div class="field">
        <label for="password">New password</label>
        <div class="fw">
          <input type="password" id="password" name="password"
            placeholder="Create a new password" required
            autocomplete="new-password" oninput="checkStrength(this.value)">
          <button type="button" class="tb" onclick="tp('password',this)" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Must be at least 8 characters
        </div>
        <div class="strength-wrap" id="strengthWrap" style="display:none">
          <div class="strength-bars">
            <div class="s-bar" id="sb1"></div>
            <div class="s-bar" id="sb2"></div>
            <div class="s-bar" id="sb3"></div>
            <div class="s-bar" id="sb4"></div>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <div class="fw">
          <input type="password" id="confirm_password" name="confirm_password"
            placeholder="Confirm your new password" required
            autocomplete="new-password">
          <button type="button" class="tb" onclick="tp('confirm_password',this)" aria-label="Toggle confirm password visibility">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-p">Reset password</button>
    </form>

    <div class="btm"><a href="{% url 'login' %}">← Back to Sign in</a></div>
  </div>
</div>
<script>
function tp(id, btn) {
  var el = document.getElementById(id);
  var show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  btn.querySelector('svg').innerHTML = show
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}
function checkStrength(val) {
  var wrap = document.getElementById('strengthWrap');
  var label = document.getElementById('strengthLabel');
  var bars = [document.getElementById('sb1'), document.getElementById('sb2'), document.getElementById('sb3'), document.getElementById('sb4')];
  if (!val) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  var score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  var levels = [['weak','Weak'],['fair','Fair'],['good','Good'],['strong','Strong']];
  bars.forEach(function(b, i) { b.className = 's-bar' + (i < score ? ' ' + levels[score-1][0] : ''); });
  label.textContent = 'Password strength: ' + levels[score-1][1];
  label.style.color = score===1?'#EF4444':score===2?'#F59E0B':score===3?'#6c63ff':'#10B981';
}
</script>
</body>
</html>
